name: Daily PuneAir pipeline

on:
  schedule:
    - cron: "30 1 * * *"     # 01:30 UTC = 07:00 IST every day
  workflow_dispatch:           # also lets you press "Run workflow" manually
    inputs:
      past_days:
        description: "Days of history to download (use 60 for the very first run)"
        default: "3"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run pipeline
        run: python run_pipeline.py --past-days ${{ github.event.inputs.past_days || '3' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
